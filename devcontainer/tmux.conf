set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB"
set -ga terminal-overrides '*:Ss=\E[%p1%d q:Se=\E[ q'

set -sg escape-time 0
set -g mouse on
set -g focus-events on
set -g history-limit 50000

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

unbind C-b
set -g prefix C-a
bind C-a send-prefix

bind r source-file ~/.tmux.conf \; display "Config reloaded"

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %
bind c new-window -c "#{pane_current_path}"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5

setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel

set -g status-position bottom
set -g status-style 'bg=default fg=white'
set -g status-left '#[fg=blue,bold]#S #[fg=white]│ '
set -g status-left-length 20
set -g status-right '#[fg=yellow]#{?client_prefix,PREFIX ,}#[fg=white]%H:%M'
set -g status-right-length 20

setw -g window-status-format '#[fg=gray]#I:#W'
setw -g window-status-current-format '#[fg=cyan,bold]#I:#W'
setw -g window-status-separator '  '

set -g pane-border-style 'fg=brightblack'
set -g pane-active-border-style 'fg=blue'

bind a run-shell '\
  if ! tmux has-session -t agent 2>/dev/null; then \
    tmux new-session -d -s agent -n claude; \
    tmux send-keys -t agent:claude "claude" Enter; \
    tmux new-window -t agent -n codex; \
    tmux send-keys -t agent:codex "codex" Enter; \
    tmux select-window -t agent:claude; \
  fi; \
  tmux switch-client -t agent'
