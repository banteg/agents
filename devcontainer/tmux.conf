# terminal settings for ghostty
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-ghostty:Tc"
set -ag terminal-overrides ",xterm-ghostty:RGB"

# enable true color support
set -sa terminal-features ',xterm-ghostty:RGB'

# fix cursor shape changes (for vim, etc.)
set -ga terminal-overrides '*:Ss=\E[%p1%d q:Se=\E[ q'

# enable focus events for better integration
set -g focus-events on

# reduce escape delay for faster response
set -sg escape-time 10

# enable mouse support
set -g mouse on
